services:
  mysql:
    image: mysql:8.0
    container_name: nl2sql-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: card_analytics
    ports:
      - "3307:3306"  # host 3306 is taken by the local MySQL80 service
    volumes:
      - mysql_data:/var/lib/mysql
      - ./output:/docker-entrypoint-initdb.d
    healthcheck:   # the app waits for this, so its startup index build finds the data
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: nl2sql-redis
    # clarifications are short-lived and re-askable, so persistence is not worth the
    # disk; a restart loses them and the user simply asks again
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  app:
    build: .
    image: intentql:latest
    container_name: nl2sql-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    # GROQ_API_KEY and the model names come from .env; the connection settings below
    # override .env's, which point at the host ports for running outside Docker
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DATABASE: card_analytics
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"  # host 8000 is taken by another project's API
    volumes:
      - agent_state:/app/.agent_state   # LangGraph checkpoints survive container rebuilds
    restart: unless-stopped

volumes:
  mysql_data:
  agent_state:
