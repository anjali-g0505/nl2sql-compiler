services:
  mysql:
    image: mysql:8.0
    container_name: nl2sql-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: card_analytics
    ports:
      - "3307:3306"  # host 3306 is taken by the local MySQL80 service
    volumes:
      - mysql_data:/var/lib/mysql
      - ./output:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: nl2sql-redis
    # clarifications are short-lived and re-askable, so persistence is not worth the
    # disk; a restart loses them and the user simply asks again
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

volumes:
  mysql_data:
